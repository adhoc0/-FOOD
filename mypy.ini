[mypy]

python_version = 3.14

warn_return_any = True
warn_unused_configs = True

disallow_untyped_defs = True
disallow_incomplete_defs = True

check_untyped_defs = True

no_implicit_optional = True

warn_redundant_casts = True
warn_unused_ignores = True

warn_no_return = True

warn_unreachable = True

strict_equality = True

show_error_codes = True

pretty = True

plugins =
    mypy_django_plugin.main

[mypy.plugins.django-stubs]

django_settings_module = core.settings

[mypy-decouple]

ignore_missing_imports = True

# Test kodunda her fonksiyona tür yazmak değer katmıyor; yalnızca üretim kodu strict.
[mypy-tests.*,*.tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False
warn_return_any = False
ignore_errors = True

# Manager.from_queryset() dinamik taban sınıfı mypy'ye Any olarak göründüğü için
# selector dönüşlerinde `no-any-return` yanlış pozitifi üretiyor.
[mypy-*.selectors.*,recipes.services.search_service]
warn_return_any = False

[mypy-sentry_sdk.*]
ignore_missing_imports = True
