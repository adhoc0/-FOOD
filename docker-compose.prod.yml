# Production dağıtımı (tek sunucu, Docker Compose, Nginx + Let's Encrypt).
# Kullanım: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# İlk kurulum: scripts/init-letsencrypt.sh

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-web-environment: &web-environment
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY tanımlanmalıdır}
  DEBUG: "False"
  ALLOWED_HOSTS: ${DOMAIN:?DOMAIN tanımlanmalıdır}
  CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
  ADMIN_URL: ${ADMIN_URL:-yonetim/}
  DB_NAME: ${DB_NAME:-food_db}
  DB_USER: ${DB_USER:-food}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanımlanmalıdır}
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/1
  NUM_PROXIES: "1"
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@localhost}

services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME:-food_db}
      POSTGRES_USER: ${DB_USER:-food}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanımlanmalıdır}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  initialize:
    build:
      context: .
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput
    environment: *web-environment
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  web:
    build:
      context: .
    environment: *web-environment
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # SECURE_SSL_REDIRECT açık olduğundan istek HTTPS arkasındaymış gibi
      # işaretlenir; aksi halde 301 dönerdi.
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request as u;
          r = u.Request('http://127.0.0.1:8000/robots.txt', headers={'X-Forwarded-Proto': 'https', 'Host': '${DOMAIN}'});
          u.urlopen(r, timeout=5)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  certbot:
    image: certbot/certbot:latest
    entrypoint: /bin/sh
    command:
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certbot_www:
  letsencrypt:
